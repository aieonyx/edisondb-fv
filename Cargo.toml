[package]
name = "edisondb"
version = "0.6.0-p3m9"
edition = "2024"
description = "The sovereign, AI-native, multi-model database engine. Encrypted by default. Yours forever."
license = "Apache-2.0"
repository = "https://github.com/aieonyx/edisondb"
homepage = "https://edisondb.com"
documentation = "https://docs.rs/edisondb"
readme = "README.md"
keywords = ["database", "encryption", "sovereignty", "embedded", "rust"]
categories = ["database", "cryptography", "data-structures"]
authors = ["Edison Lepiten <aieonyx.eu@gmail.com>"]

[features]
default = ["server"]
server  = ["tonic", "prost", "tonic-prost"]
mobile  = ["jni"]

[lib]
name       = "edisondb"
path       = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
aes-gcm = "0.10"
rand = "0.8"
argon2 = "0.5"
redb = "2"
rpassword = "7"
zeroize = "1"
thiserror = "1"
pest = "2.8.6"
pest_derive = "2.8.6"
rustyline = "18.0.0"
sha2 = "0.11.0"
axum = "0.8.9"
tokio = { version = "1.52.3", features = ["full"] }
tower-http = { version = "0.6.11", features = ["cors", "trace"] }
fjall = "3.1.6"
instant-distance = "0.6.1"
reqwest = { version = "0.13.4", features = ["blocking", "json"] }
tonic = { version = "0.14", optional = true }
prost = { version = "0.14", optional = true }
tonic-prost = { version = "0.14", optional = true }
jni = { version = "0.21", features = ["invocation"], optional = true }
blake3 = "1"

[build-dependencies]
tonic-prost-build = "0.14"
protoc-bin-vendored = "3.2"

[target.'cfg(target_os = "android")'.dependencies]
log            = "0.4"
android_logger = "0.13"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
tonic = "0.14"
tokio = { version = "1", features = ["full"] }
futures = "0.3"
proptest = "1"
trybuild = "1"

[[bin]]
name = "edisondb"
path = "src/main.rs"

[[bin]]
name = "edisondb-server"
path = "src/server.rs"

[[bench]]
name = "edisondb_bench"
harness = false

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(kani)"] }

